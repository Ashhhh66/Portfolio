name = "66-tool-download"
main = "src/index.js"
compatibility_date = "2026-08-30"

[vars]
R2_BUCKET = "66-tool-releases"
R2_OBJECT = "66-Tool-v1.0.0.zip"
DOWNLOAD_FILENAME = "66-Tool-v1.0.0.zip"
FROM_EMAIL = "Ashh66 <66-tool@ashh66.dev>"
REPLY_TO = "Ashh66.dev@gmail.com"
SITE_ORIGIN = "https://ashh66.dev"

[[r2_buckets]]
binding = "TOOL_BUCKET"
bucket_name = "66-tool-releases"

[[routes]]
pattern = "ashh66.dev/66-tool/success*"
zone_name = "ashh66.dev"

[[routes]]
pattern = "ashh66.dev/api/stripe/webhook*"
zone_name = "ashh66.dev"
